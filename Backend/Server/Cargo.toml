[workspace]

members = [
    "identity-organizator",
    "lib-axum-organizator", "organizator-server",
 ]
 resolver = "3"

[workspace.package]
edition = "2024"

[profile.release]
strip = true
lto = true
codegen-units = 1
opt-level = 3

[workspace.dependencies]
argon2 = { version = "0.5.3", features = ["std"] }
axum = { version = "0.8.9", features = ["macros", "multipart"] }
axum-prometheus = "0.10.1"
base64 = "0.22.1"
deadpool-postgres = "0.14.1"
dirs = "6.0.0"
indoc = "2.0.7"
jsonwebtoken = { version = "10.4.0", features = ["rust_crypto"] }
mimalloc = "0.1.52"
password-hash = "0.6.1"
regex = "1"
reqwest = { version = "0.13.4", features = ["json"] }
ring = "0.17.14"
serde_json = { version = "1.0.151", features = ["preserve_order"] }
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.19"
tokio-postgres = { version = "0.7.18", features = [ "with-uuid-1" ] }
tokio = { version = "1.53.0", features = ["full"] }
toml = "1.1.3"
tower = "0.5"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
utoipa = { version = "5.5.0", features = ["uuid", "preserve_order", "preserve_path_order", "axum_extras"] }
utoipa-axum = "0"
utoipa-swagger-ui = { version = "9", features = ["axum"] }
uuid = { version = "1", features = ["v4", "serde"] }

