api_ip = "127.0.0.1:8080"
metrics_ip = "127.0.0.1:9091"
swagger_path = "/"

[postgres]
host = "orgdb.lab"
port = 5432
user = "organizator_prod"
dbname = "organizator_prod"
#application_name = "Identity Service"
# password comes from the environment variable POSTGRES_PASSWORD

[security]
# The long-term choice on the login page: one week, with four days in which a refresh is allowed.
long_session_expiry = 604800
long_session_expiry_grace_period = 345600
# The ordinary session: one hour, with twenty minutes in which a refresh is allowed.
session_expiry = 3600
session_expiry_grace_period = 1200
