api_ip = "127.0.0.1:8082"
metrics_ip = "127.0.0.1:9092"
swagger_path = "/"

[postgres]
host = "orgdb.lab"
port = 5432
user = "organizator_prod"
dbname = "organizator_prod"
# password comes from the environment variable POSTGRES_PASSWORD

[security]
public_key_url = "http://localhost:8080/public"
# The lifetimes the identity service issues tokens with. This server refreshes them too — a
# refresh that used different numbers would change a login's length — so the two files agree.
long_session_expiry = 604800
long_session_expiry_grace_period = 345600
session_expiry = 3600
session_expiry_grace_period = 1200

[file_storage]
# file storage directory
#path = "../../../Frontend/Nginx/files"
path = "/var/www/organizator.ro/files"

