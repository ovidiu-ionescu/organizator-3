<!DOCTYPE html>
<html lang="en">
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta charset="utf-8">
    <link rel="apple-touch-icon" sizes="152x152" href="/images/ios/tulip-blue-touch-icon-ipad.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/images/ios/tulip-blue-touch-icon-ipad-retina.png">
    <link rel="apple-touch-icon" sizes="167x167" href="/images/ios/tulip-blue-touch-icon-iphone-retina.png">
    <link rel="manifest" href="/org-manifest.json">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Libre+Barcode+EAN13+Text&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Libre+Barcode+128&family=Libre+Barcode+128+Text&display=swap" rel="stylesheet">
    <script type="module">
      //import "/worker/app.js";

      import * as router from "./dom/memo-router.js";
      window.load_route = router.load_route;
      window.searchMemos = router.searchMemos;
    </script>
    <script type="module">
      import "./dom/memo-editor.js";
      import "./dom/journal.js";
    </script>
    <script type="text/javascript"></script>
    <style>
      html {
        height: 100%;
        padding: 0;
        margin: 0;
        border: 0;
      }
      body {
        height: 100%;
        margin: 0;
        padding: 0;
        border: 0;
        font-size: 16px;
        font-family: Roboto, sans-serif;
        background-color: black;
        color: white;
      }
      main {
        height: 100%;
        display: flex;
        flex-flow: column;
        padding: 0;
      }
      memo-editor {
        flex: 1;
      }

      section {
        flex: 1;
        display: flex;
        flex-flow: column;
      }
      #titles_info {
        margin: 5px 0;
        padding: 5px;
        border-bottom: 1px solid #555;
        font-size: 0.9rem;
      }
      #titles_info summary {
        cursor: pointer;
      }
      #titles_info summary a {
        margin-left: 10px;
        font-size: 0.85rem;
      }
      #titles_info p {
        margin: 8px 0 4px 0;
        color: #f1c40f; /* same amber as the dirty marker in the list */
        /* a report of a save is one line per memo that was left behind */
        white-space: pre-line;
      }
      #memoTitlesList {
        list-style: none;
        padding-left: 0;
      }
      #memoTitlesList a {
        padding: 5px;
      }
      /* Define the symbols based on the data-status attribute */
      #memoTitlesList li::before {
        _margin-right: 12px;
        font-weight: bold;
        width: 25px; /* Keeps alignment consistent */
        display: inline-block;
        text-align: center;
      }

      #memoTitlesList li[data-status="new"]::before     { content: "\2731"; color: #2ecc71; } /* ✱ (Heavy Asterisk) */
      #memoTitlesList li[data-status="dirty"]::before { content: "\270E"; color: #f1c40f; } /* ✎ (Lower Right Pencil) */
      #memoTitlesList li[data-status="cached"]::before  { content: "\231B"; color: #3498db; } /* ⌛ (Hourglass) */
      #memoTitlesList li[data-status="server"]::before  { content: "\2601"; color: #ffffff; } /* ☁ (Cloud) */
      #memoTitlesList li[data-status="shared"]::before  { content: "\2601"; color: #9b59b6; } /* ☁ (Cloud) */

      input[type='search'] {
        font-size: 16px;
      }
      #search_button {
        vertical-align: middle;
      }
      a {
        color: steelblue;
      }
      footer a {
        margin-left: 20px;
      }
    </style>
    <title>Memo</title>
  </head>
  <body onload="load_route()">
    <main>
      <section id="singleMemo" page><memo-editor id="editor"></memo-editor></section>
      <section id="memoTitles" page>
        <nav>
            <input type="search" id="searchCriteria" autocorrect="off" autocapitalize="none" 
              onkeyup="(e => {if(e.keyCode === 13) searchMemos()})(event)"/>
            <img src="/images/ic_search_48px.svg"
              id="search_button"
              onclick="searchMemos()"
             alt="search">
            <span style="display:inline-block; width: 48px;">&nbsp;</span>
            <a href="/memo/new">New</a>
        </nav>
        <!-- Where the list came from, and why, when that is worth explaining. Kept behind a
             summary because the list itself can be long enough that a standing banner costs
             more room than the message is worth. The offer to cache everything sits on the
             summary line, where it is visible with the fold closed, and only while the server is
             the one answering. -->
        <details id="titles_info">
          <summary>
            <span id="titles_info_summary">Memos from the server</span>
            <a href="#" id="cache_all" hidden
               title="fetch every memo into this device, so the app works with the server down">Cache all</a>
          </summary>
          <p id="titles_info_message"></p>
        </details>
        <ul id="memoTitlesList"></ul>
        <footer style="text-align: right;"><a href="/memo/$$$admin">Admin</a><a href="/journal">Journal</a></footer>
      </section>
      <log-journal id="journal" page></log-journal>
    </main>
  </body>
</html>

<!-- e => { console.log(e.keyCode); if(e.keyCode === 13) searchMemos() }-->
