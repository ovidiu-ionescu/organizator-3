<!DOCTYPE html>
<html lang="en">
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta charset="utf-8">
    <meta name="theme-color" content="#000000">
    <!-- The theme is applied here, before anything is drawn, so the app does not flash the
         default and then change on every start. A module script would be too late: modules run
         after the page has been parsed. The key is also in src/main/dom/theme.ts, which is what
         writes it; the two have to agree. -->
    <script>
      try {
        const theme = localStorage.getItem("memo_theme");
        if (theme) document.documentElement.dataset.theme = theme;
      } catch (e) {
        // A browser that will not give storage: the app opens on the default theme.
      }
    </script>
    <link rel="stylesheet" href="./themes.css">
    <link rel="apple-touch-icon" sizes="152x152" href="/images/ios/tulip-blue-touch-icon-ipad.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/images/ios/tulip-blue-touch-icon-ipad-retina.png">
    <link rel="apple-touch-icon" sizes="167x167" href="/images/ios/tulip-blue-touch-icon-iphone-retina.png">
    <link rel="manifest" href="/org-manifest.json">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Libre+Barcode+EAN13+Text&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Libre+Barcode+39&family=Libre+Barcode+39+Text&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Libre+Barcode+128&family=Libre+Barcode+128+Text&display=swap" rel="stylesheet">
    <script type="module">
      import * as router from "./dom/memo-router.js";
      window.load_route = router.load_route;
      window.searchMemos = router.searchMemos;
    </script>
    <script type="module">
      import "./dom/memo-editor.js";
      import "./dom/journal.js";
      import "./dom/pwa.js";
      import "./dom/app-menu.js";
    </script>
    <script type="text/javascript"></script>
    <style>
      html {
        height: 100%;
        padding: 0;
        margin: 0;
        border: 0;
      }
      body {
        height: 100%;
        margin: 0;
        padding: 0;
        border: 0;
        font-size: 16px;
        font-family: Roboto, sans-serif;
        background-color: black;
        color: white;
      }
      main {
        height: 100%;
        display: flex;
        flex-flow: column;
        padding: 0;
      }
      memo-editor {
        flex: 1;
      }

      section {
        flex: 1;
        display: flex;
        flex-flow: column;
      }
      #titles_info {
        margin: 5px 0;
        padding: 5px;
        border-bottom: 1px solid #555;
        font-size: 0.9rem;
      }
      #titles_info summary {
        cursor: pointer;
      }
      #titles_info p {
        margin: 8px 0 4px 0;
        color: #f1c40f; /* same amber as the dirty marker in the list */
        /* a report of a save is one line per memo that was left behind */
        white-space: pre-line;
      }
      #memoTitlesList {
        list-style: none;
        padding-left: 0;
      }
      #memoTitlesList a {
        padding: 5px;
      }
      /* Define the symbols based on the data-status attribute */
      #memoTitlesList li::before {
        _margin-right: 12px;
        font-weight: bold;
        width: 25px; /* Keeps alignment consistent */
        display: inline-block;
        text-align: center;
      }

      #memoTitlesList li[data-status="new"]::before     { content: "\2731"; color: #2ecc71; } /* ✱ (Heavy Asterisk) */
      #memoTitlesList li[data-status="dirty"]::before { content: "\270E"; color: #f1c40f; } /* ✎ (Lower Right Pencil) */
      #memoTitlesList li[data-status="cached"]::before  { content: "\231B"; color: #3498db; } /* ⌛ (Hourglass) */
      #memoTitlesList li[data-status="server"]::before  { content: "\2601"; color: #ffffff; } /* ☁ (Cloud) */
      #memoTitlesList li[data-status="shared"]::before  { content: "\2601"; color: #9b59b6; } /* ☁ (Cloud) */

      input[type='search'] {
        font-size: 16px;
      }
      /* The row ends with the offer of a new memo, and the menu button hangs over the corner of
         the page: the padding keeps the one out from under the other. What used to be a 48px
         spacer before the link is now a normal gap, which is where the room comes from. */
      #memoTitles nav {
        padding-right: 56px;
      }
      #search_button {
        vertical-align: middle;
      }
      /* The service worker's line, at the top of whichever page is showing: a new version is
         ready, or the app can now be opened with the server unreachable. Not the editor's
         #status, which belongs to the memo being edited — that one is written by show_status(),
         which replaces the memo, and the editor is not even on screen while the list is up. */
      #pwa_bar {
        padding: 6px 8px;
        /* Room at the right for the menu button, which is fixed over this corner. */
        padding-right: 48px;
        background-color: #2c3e50;
        font-size: 0.9rem;
      }
      /* The app's own menu. Fixed to the corner so it is on every page — the list, a memo, the
         journal — rather than belonging to one of them. */
      #app_menu {
        position: fixed;
        top: 0;
        right: 0;
        /* Above what it sits over. Without this the editor — whose box covers the whole viewport
           whenever the bar below is not showing — takes the taps meant for the button, and the
           dots simply do nothing. */
        z-index: 10;
        width: 44px;
        height: 44px;
        padding: 8px;
        border: none;
        background: none;
        color: white;
        cursor: pointer;
      }
      #app_menu img-inline-svg {
        display: block;
        width: 100%;
        height: 100%;
      }
      #pwa_bar a {
        margin-left: 10px;
      }
      a {
        color: steelblue;
      }
    </style>
    <title>Memo</title>
  </head>
  <body onload="load_route()">
    <main>
      <!-- The few things that are about the app rather than about what is on screen. Outside the
           [page] sections, like the bar below it, so it is there whichever page is showing. -->
      <button id="app_menu" title="more" aria-label="more" aria-haspopup="dialog">
        <img-inline-svg src="/images/more_vert.svg"></img-inline-svg>
      </button>
      <!-- Outside the [page] sections on purpose: the service worker's messages are about the
           whole app, and the sections are hidden and shown as the router moves between them. -->
      <div id="pwa_bar" hidden>
        <span id="pwa_bar_message"></span>
        <a href="#" id="pwa_bar_action" hidden></a>
        <a href="#" id="pwa_bar_dismiss" hidden>dismiss</a>
      </div>
      <section id="singleMemo" page><memo-editor id="editor"></memo-editor></section>
      <section id="memoTitles" page>
        <nav>
            <input type="search" id="searchCriteria" autocorrect="off" autocapitalize="none" 
              onkeyup="(e => {if(e.keyCode === 13) searchMemos()})(event)"/>
            <img src="/images/ic_search_48px.svg"
              id="search_button"
              onclick="searchMemos()"
             alt="search">
            <span style="display:inline-block; width: 16px;">&nbsp;</span>
            <a href="/memo/new">New</a>
        </nav>
        <!-- Where the list came from, and why, when that is worth explaining. Kept behind a
             summary because the list itself can be long enough that a standing banner costs
             more room than the message is worth. -->
        <details id="titles_info">
          <summary>
            <span id="titles_info_summary">Memos from the server</span>
          </summary>
          <p id="titles_info_message"></p>
        </details>
        <ul id="memoTitlesList"></ul>
      </section>
      <log-journal id="journal" page></log-journal>
    </main>
  </body>
</html>
