<header class="app-header">
  <h1>User administration</h1>
  <button type="button" class="btn" (click)="theme.toggle()">
    {{ theme.isDark() ? 'Switch to light theme' : 'Switch to dark theme' }}
  </button>
</header>

<!-- A non-admin has one row of their own and nothing to filter, so the box would only be in the way.
     Kept while the answer is still unknown, so an admin does not see it appear a moment late. -->
@if (session.isAdmin() !== false) {
  <section class="filters">
    <app-user-filter (filterChange)="updateFilter($event)"></app-user-filter>
  </section>
}
<section class="results">
  <app-user-list [filterTerm]="searchTerm()"></app-user-list>
</section>
